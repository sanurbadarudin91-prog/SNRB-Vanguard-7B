# ==========================================================
# SNRB-Vanguard-7B — Konfigurasi QLoRA Default
# Base model : Qwen/Qwen2.5-7B-Instruct
# ==========================================================
# Override lewat CLI: python src/train_qlora.py --config configs/qlora_default.yaml
# ==========================================================

model:
  base_model: "Qwen/Qwen2.5-7B-Instruct"
  # 4-bit quantization (NF4) -> hemat VRAM, kualitas mendekati fp16
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  trust_remote_code: true
  # Aktifkan bila GPU mendukung flash-attention 2
  attn_implementation: "sdpa"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "outputs/snrb-vanguard-7b-qlora"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  bf16: true
  fp16: false
  optim: "paged_adamw_8bit"
  gradient_checkpointing: true
  group_by_length: true
  report_to: "none"
  seed: 42

data:
  dataset_path: "data/samples.jsonl"
  # Panjang sequence maksimum (token). Turunkan bila VRAM terbatas.
  # Dataset saat ini max 447 token, jadi 512 sudah cukup tanpa memotong sampel.
  max_seq_length: 512
  validation_split: 0.0
  # Gunakan chat template bawaan model agar format konsisten
  use_chat_template: true
